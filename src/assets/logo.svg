
<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="tube" gradientUnits="userSpaceOnUse" x1="56" y1="60" x2="152" y2="140">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#915eff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="cyan" gradientUnits="userSpaceOnUse" x1="100" y1="88" x2="128" y2="120">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Fond bleu nuit -->
  <circle cx="100" cy="100" r="92" fill="#070b1f"/>

  <!-- Cercle extérieur violet uni -->
  <circle
    cx="100"
    cy="100"
    r="90"
    fill="none"
    stroke="#915eff"
    stroke-width="4"
  />

  <!-- Monogramme ID -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M62 56 V132 A12 12 0 0 0 86 132 V74 Q86 62 98 62 H112 A40 40 0 0 1 112 142 H100"
      stroke="url(#tube)"
      stroke-width="11"
    />

    <!-- Accent cyan -->
    <path
      d="M102 88 H112 A16 16 0 0 1 112 120 H106"
      stroke="url(#cyan)"
      stroke-width="9"
    />
  </g>
</svg>
